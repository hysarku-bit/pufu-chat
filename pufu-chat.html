<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>プフとおしゃべり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1a1428;
    --night-2:#241c36;
    --ink:#f2ecf7;
    --dim:#a99bbf;
    --wing:#f3a9a0;      /* プフの髪色 */
    --wing-deep:#c9746e;
    --mint:#bfe9d9;
    --mint-ink:#173a30;
    --line:rgba(243,169,160,.22);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--night);color:var(--ink)}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
    font-size:16px;line-height:1.7;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-text-size-adjust:100%;
  }
  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px 10px;border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-weight:600;font-size:20px;margin:0;letter-spacing:.06em;flex:1;
  }
  header button{
    background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;
  }
  #status{font-size:12px;color:var(--dim);padding:6px 18px 0;min-height:1.4em}
  #status.err{color:#ffb4a8}
  #log{flex:1;overflow-y:auto;padding:12px 18px 24px;-webkit-overflow-scrolling:touch}
  .msg{display:flex;margin:10px 0;gap:8px;align-items:flex-end}
  .msg.me{justify-content:flex-end}
  .bubble{
    max-width:78%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-break:break-word;
  }
  .me .bubble{background:var(--mint);color:var(--mint-ink);border-bottom-right-radius:5px}
  .pufu .bubble{
    background:var(--night-2);border:1px solid var(--line);border-bottom-left-radius:5px;
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:1.85;
  }
  .replay{
    flex:none;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:none;color:var(--wing);font-size:15px;
  }
  .replay:disabled{opacity:.35}
  .thinking .bubble{color:var(--dim);font-style:italic}
  form{
    display:flex;gap:10px;padding:10px 14px 14px;border-top:1px solid var(--line);background:var(--night);
  }
  textarea{
    flex:1;resize:none;height:46px;max-height:120px;
    background:var(--night-2);color:var(--ink);border:1px solid var(--line);border-radius:14px;
    padding:11px 14px;font:inherit;font-size:16px;
  }
  textarea:focus{outline:2px solid var(--wing);outline-offset:0}
  #send{
    width:52px;border-radius:14px;border:none;background:var(--wing);color:var(--night);
    font-size:20px;font-weight:600;
  }
  #send:disabled{background:var(--wing-deep);opacity:.6}

  /* 設定 */
  #settings{
    position:fixed;inset:0;background:rgba(26,20,40,.96);overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 20px) 22px 40px;display:none;
  }
  #settings.open{display:block}
  #settings h2{font-family:"Shippori Mincho",serif;font-weight:600;font-size:22px;margin:0 0 6px}
  #settings p{color:var(--dim);font-size:14px;margin:0 0 22px}
  label{display:block;font-size:14px;color:var(--dim);margin:16px 0 6px}
  input,select{
    width:100%;background:var(--night-2);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;font:inherit;font-size:16px;
  }
  .row{display:flex;gap:12px;margin-top:28px}
  .row button{
    flex:1;padding:13px;border-radius:12px;font:inherit;font-size:16px;border:1px solid var(--line);
    background:none;color:var(--ink);
  }
  .row button.primary{background:var(--wing);color:var(--night);border-color:var(--wing);font-weight:600}
  .danger{margin-top:36px;text-align:center}
  .danger button{background:none;border:none;color:var(--dim);text-decoration:underline;font:inherit;font-size:14px}
  @media (prefers-reduced-motion:no-preference){
    .bubble{animation:pop .18s ease-out}
    @keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
  }
</style>
</head>
<body>

<header>
  <h1>プフ</h1>
  <button id="openSettings" type="button">設定</button>
</header>
<div id="status"></div>
<div id="log"></div>

<form id="chat">
  <textarea id="input" placeholder="プフに話しかける" rows="1" enterkeyhint="send"></textarea>
  <button id="send" type="submit">♪</button>
</form>

<div id="settings">
  <h2>設定</h2>
  <p>キーはこのiPadの中にだけ保存される。どこにも送らない。</p>

  <label for="difyKey">Dify APIキー（app- で始まるやつ）</label>
  <input id="difyKey" type="password" autocomplete="off" placeholder="app-…">

  <label for="difyUrl">Dify APIエンドポイント</label>
  <input id="difyUrl" type="url" value="https://api.dify.ai/v1">

  <label for="fishKey">Fish Audio APIキー</label>
  <input id="fishKey" type="password" autocomplete="off">

  <label for="fishRef">Fish Audio モデルID（プフの声）</label>
  <input id="fishRef" type="text" autocomplete="off" placeholder="例: 7f92f8afb8ec43bf81429cc1c9199cb1">

  <label for="fishModel">Fish Audio 音声エンジン</label>
  <select id="fishModel">
    <option value="s1">S1（新しい・日本語うまい）</option>
    <option value="speech-1.6">speech-1.6</option>
    <option value="speech-1.5">speech-1.5</option>
  </select>

  <label for="autoplay">返事が来たら自動で声を鳴らす</label>
  <select id="autoplay">
    <option value="1">鳴らす</option>
    <option value="0">鳴らさない（▶︎を押した時だけ）</option>
  </select>

  <div class="row">
    <button type="button" id="cancelSettings">閉じる</button>
    <button type="button" class="primary" id="saveSettings">保存する</button>
  </div>
  <div class="danger">
    <button type="button" id="resetConv">会話をリセットする（プフの記憶を最初から）</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const log = $('log'), status = $('status'), input = $('input'), send = $('send');
  const KEYS = ['difyKey','difyUrl','fishKey','fishRef','fishModel','autoplay'];
  const store = {
    get: k => localStorage.getItem('pufu.'+k) ?? '',
    set: (k,v) => localStorage.setItem('pufu.'+k, v),
  };
  let conversationId = store.get('conversationId');
  const userId = store.get('userId') || (() => { const u = 'mint-' + Math.random().toString(36).slice(2); store.set('userId', u); return u; })();

  // ---- iPad用：タップの中で一度だけ鳴らして、以後の自動再生を許可させる ----
  const player = new Audio();
  player.setAttribute('playsinline','');
  let unlocked = false;
  function silentWav(){
    const sr=8000,n=160,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  }
  const silence = silentWav();
  function unlock(){
    if (unlocked) return;
    player.src = silence;
    player.play().then(()=>{ unlocked = true; }).catch(()=>{});
  }

  // ---- 設定 ----
  function loadSettings(){
    KEYS.forEach(k => { const v = store.get(k); if (v) $(k).value = v; });
    if (!store.get('autoplay')) $('autoplay').value = '1';
  }
  function saveSettings(){
    KEYS.forEach(k => store.set(k, $(k).value.trim()));
    $('settings').classList.remove('open');
    setStatus('保存した');
  }
  function settingsOk(){
    return store.get('difyKey') && store.get('fishKey') && store.get('fishRef');
  }
  $('openSettings').onclick = () => $('settings').classList.add('open');
  $('cancelSettings').onclick = () => $('settings').classList.remove('open');
  $('saveSettings').onclick = saveSettings;
  $('resetConv').onclick = () => {
    conversationId = ''; store.set('conversationId','');
    log.innerHTML = ''; $('settings').classList.remove('open');
    setStatus('会話をリセットした');
  };

  function setStatus(t, err=false){ status.textContent = t || ''; status.className = err ? 'err' : ''; }

  // ---- 表示 ----
  function addMsg(who, text){
    const row = document.createElement('div'); row.className = 'msg ' + who;
    const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
    let btn = null;
    if (who === 'pufu') {
      btn = document.createElement('button'); btn.className = 'replay'; btn.textContent = '▶︎';
      btn.disabled = true; btn.type = 'button';
      row.append(btn, b);
    } else row.append(b);
    log.append(row); log.scrollTop = log.scrollHeight;
    return {row, b, btn};
  }

  // ---- Dify ----
  async function askDify(query){
    const r = await fetch(store.get('difyUrl').replace(/\/$/,'') + '/chat-messages', {
      method:'POST',
      headers:{ 'Authorization':'Bearer ' + store.get('difyKey'), 'Content-Type':'application/json' },
      body: JSON.stringify({ inputs:{}, query, response_mode:'blocking', user:userId,
        ...(conversationId ? {conversation_id: conversationId} : {}) })
    });
    if (!r.ok) throw new Error('Difyが ' + r.status + ' を返した：' + (await r.text()).slice(0,200));
    const j = await r.json();
    if (j.conversation_id) { conversationId = j.conversation_id; store.set('conversationId', conversationId); }
    return j.answer || '';
  }

  // ---- Fish Audio ----
  async function speak(text){
    const r = await fetch('https://api.fish.audio/v1/tts', {
      method:'POST',
      headers:{ 'Authorization':'Bearer ' + store.get('fishKey'), 'Content-Type':'application/json',
                'model': store.get('fishModel') || 's1' },
      body: JSON.stringify({ text, reference_id: store.get('fishRef'), format:'mp3', latency:'normal' })
    });
    if (!r.ok) throw new Error('Fish Audioが ' + r.status + ' を返した：' + (await r.text()).slice(0,200));
    return URL.createObjectURL(await r.blob());
  }
  function play(url){
    player.src = url;
    return player.play();
  }

  // ---- 送信 ----
  async function submit(){
    const text = input.value.trim();
    if (!text) return;
    if (!settingsOk()) { $('settings').classList.add('open'); setStatus('先にキーを入れて', true); return; }
    unlock();                       // ← タップの中で呼ぶのが大事
    input.value = ''; send.disabled = true;
    addMsg('me', text);
    const wait = addMsg('pufu', '……');
    wait.row.classList.add('thinking');
    try {
      setStatus('プフが考えてる');
      const answer = await askDify(text);
      wait.row.classList.remove('thinking'); wait.b.textContent = answer;
      log.scrollTop = log.scrollHeight;
      setStatus('声を作ってる');
      const url = await speak(answer);
      wait.btn.disabled = false;
      wait.btn.onclick = () => play(url).catch(e => setStatus('再生できない：' + e.message, true));
      setStatus('');
      if (store.get('autoplay') !== '0') {
        try { await play(url); }
        catch (e) { setStatus('自動再生が止められた。▶︎を押すと鳴る', true); }
      }
    } catch (e) {
      wait.row.classList.remove('thinking'); wait.b.textContent = '（返事が届かなかった）';
      setStatus(e.message, true);
    } finally {
      send.disabled = false;
    }
  }
  $('chat').addEventListener('submit', e => { e.preventDefault(); submit(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });

  loadSettings();
  if (!settingsOk()) { $('settings').classList.add('open'); }
})();
</script>
</body>
</html>
