<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>おしゃべり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1a1428;--night-2:#241c36;--ink:#f2ecf7;--dim:#a99bbf;
    --wing:#f3a9a0;--wing-deep:#c9746e;--mint:#bfe9d9;--mint-ink:#173a30;
    --line:rgba(243,169,160,.22);--rec:#ff7a6e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--night);color:var(--ink)}
  body{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:16px;line-height:1.7;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  header select{
    background:none;color:var(--ink);border:none;font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-weight:600;font-size:20px;letter-spacing:.06em;padding:4px 0;max-width:46%;
  }
  header select.voice{font-family:inherit;font-weight:400;font-size:14px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  header .sp{flex:1}
  header button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px}
  #status{font-size:12px;color:var(--dim);padding:6px 16px 0;min-height:1.4em;word-break:break-all}
  #status.err{color:#ffb4a8}
  #log{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
  .msg{display:flex;margin:10px 0;gap:8px;align-items:flex-end}
  .msg.me{justify-content:flex-end}
  .bubble{max-width:78%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
  .me .bubble{background:var(--mint);color:var(--mint-ink);border-bottom-right-radius:5px}
  .chara .bubble{background:var(--night-2);border:1px solid var(--line);border-bottom-left-radius:5px;
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:1.85}
  .replay{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--wing);font-size:15px}
  .replay:disabled{opacity:.35}
  .thinking .bubble{color:var(--dim);font-style:italic}
  form{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line);background:var(--night);align-items:flex-end}
  textarea{flex:1;resize:none;height:46px;max-height:120px;background:var(--night-2);color:var(--ink);
    border:1px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px}
  textarea:focus{outline:2px solid var(--wing);outline-offset:0}
  #mic,#send{width:50px;height:46px;border-radius:14px;border:none;font-size:20px;font-weight:600}
  #send{background:var(--wing);color:var(--night)}
  #send:disabled{background:var(--wing-deep);opacity:.6}
  #mic{background:var(--night-2);color:var(--wing);border:1px solid var(--line)}
  #mic.on{background:var(--rec);color:#fff;border-color:var(--rec)}
  #mic.off{display:none}

  #settings{position:fixed;inset:0;background:rgba(26,20,40,.97);overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 20px) 20px 60px;display:none}
  #settings.open{display:block}
  #settings h2{font-family:"Shippori Mincho",serif;font-weight:600;font-size:22px;margin:0 0 6px}
  #settings h3{font-family:"Shippori Mincho",serif;font-weight:600;font-size:18px;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line)}
  #settings p{color:var(--dim);font-size:14px;margin:0 0 14px}
  label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px}
  input,select.full{width:100%;background:var(--night-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:16px}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;margin-top:14px}
  .card .head{display:flex;align-items:center;gap:10px}
  .card .head input{flex:1;font-family:"Shippori Mincho",serif;font-size:18px}
  .voice-row{display:flex;gap:8px;margin-top:8px;align-items:center}
  .voice-row input{flex:1}
  .voice-row input.name{flex:0 0 38%}
  .x{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;width:40px;height:44px;font-size:18px;flex:none}
  .add{background:none;border:1px dashed var(--line);color:var(--wing);border-radius:10px;padding:10px;font:inherit;font-size:14px;width:100%;margin-top:10px}
  .row{display:flex;gap:12px;margin-top:28px}
  .row button{flex:1;padding:13px;border-radius:12px;font:inherit;font-size:16px;border:1px solid var(--line);background:none;color:var(--ink)}
  .row button.primary{background:var(--wing);color:var(--night);border-color:var(--wing);font-weight:600}
  .quiet{margin-top:8px;font-size:13px;color:var(--dim)}
  .link{background:none;border:none;color:var(--dim);text-decoration:underline;font:inherit;font-size:13px;padding:0}
  @media (prefers-reduced-motion:no-preference){
    .bubble{animation:pop .18s ease-out}
    @keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
    #mic.on{animation:pulse 1s infinite alternate}
    @keyframes pulse{to{box-shadow:0 0 0 6px rgba(255,122,110,.25)}}
  }
</style>
</head>
<body>

<header>
  <select id="charaSel" aria-label="キャラ"></select>
  <select id="voiceSel" class="voice" aria-label="声"></select>
  <span class="sp"></span>
  <button id="openSettings" type="button">設定</button>
</header>
<div id="status"></div>
<div id="log"></div>

<form id="chat">
  <textarea id="input" placeholder="話しかける" rows="1" enterkeyhint="send"></textarea>
  <button id="mic" type="button" aria-label="声で話す">🎙</button>
  <button id="send" type="submit">♪</button>
</form>

<div id="settings">
  <h2>設定</h2>
  <p>キーはこのiPadの中にだけ保存される。どこにも送らない。</p>

  <label for="fishKey">Fish Audio APIキー</label>
  <input id="fishKey" type="password" autocomplete="off">
  <label for="fishModel">Fish Audio 音声エンジン</label>
  <select id="fishModel" class="full">
    <option value="s2.1-pro">S2.1 Pro（今の最上位）</option>
    <option value="s2.1-pro-free">S2.1 Pro 無料枠</option>
    <option value="s2">S2</option>
    <option value="s1">S1（旧）</option>
  </select>
  <label for="fishProxy">Fish Audio 経由地URL（Safariから直接つながらない時だけ）</label>
  <input id="fishProxy" type="url" placeholder="空のままでOK。つながらなければ相談して">
  <label for="autoplay">返事が来たら自動で声を鳴らす</label>
  <select id="autoplay" class="full">
    <option value="1">鳴らす</option>
    <option value="0">鳴らさない（▶︎を押した時だけ）</option>
  </select>
  <label for="autosend">マイクで喋り終わったら自動で送る</label>
  <select id="autosend" class="full">
    <option value="1">送る</option>
    <option value="0">送らない（文字を確認してから♪）</option>
  </select>

  <h3>キャラ</h3>
  <p>1人につきDifyのアプリ1個。声は何個でも登録できて、上の画面で切り替えられる。</p>
  <div id="charaList"></div>
  <button type="button" class="add" id="addChara">＋ キャラを追加</button>

  <div class="row">
    <button type="button" id="cancelSettings">閉じる</button>
    <button type="button" class="primary" id="saveSettings">保存する</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const log=$('log'), status=$('status'), input=$('input'), send=$('send'), mic=$('mic');
  const G = ['fishKey','fishModel','fishProxy','autoplay','autosend'];
  const LS = { get:k=>localStorage.getItem('chat.'+k)??'', set:(k,v)=>localStorage.setItem('chat.'+k,v) };
  const uid = () => Math.random().toString(36).slice(2,10);
  const userId = LS.get('userId') || (()=>{const u='mint-'+uid(); LS.set('userId',u); return u;})();

  // ---- データ ----
  // chara: {id,name,difyKey,difyUrl,voices:[{id,name,ref}],voiceId,conversationId}
  let charas = [];
  try { charas = JSON.parse(LS.get('charas')||'[]'); } catch { charas=[]; }
  // 旧バージョン（プフ1人）からの引っ越し
  if (!charas.length && localStorage.getItem('pufu.difyKey')) {
    const o = k => localStorage.getItem('pufu.'+k)||'';
    charas = [{ id:uid(), name:'プフ', difyKey:o('difyKey'), difyUrl:o('difyUrl')||'https://api.dify.ai/v1',
      voices:[{id:uid(), name:'いつもの', ref:o('fishRef')}], voiceId:null, conversationId:o('conversationId') }];
    charas[0].voiceId = charas[0].voices[0].id;
    LS.set('charas', JSON.stringify(charas));
    if (!LS.get('fishKey')) LS.set('fishKey', o('fishKey'));
  }
  let current = LS.get('currentChara');
  const chara = () => charas.find(c=>c.id===current) || charas[0];
  const voice = () => { const c=chara(); return c && (c.voices.find(v=>v.id===c.voiceId) || c.voices[0]); };
  const saveCharas = () => LS.set('charas', JSON.stringify(charas));

  // ---- iPad：タップの中で一度無音を鳴らして自動再生を解錠 ----
  const player = new Audio(); player.setAttribute('playsinline','');
  let unlocked=false;
  function silentWav(){
    const sr=8000,n=160,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  }
  const silence = silentWav();
  function unlock(){ if(unlocked) return; player.src=silence; player.play().then(()=>{unlocked=true}).catch(()=>{}); }

  function setStatus(t,err=false){ status.textContent=t||''; status.className=err?'err':''; }

  // ---- ヘッダー ----
  function renderHeader(){
    const cs=$('charaSel'), vs=$('voiceSel');
    cs.innerHTML=''; vs.innerHTML='';
    charas.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name||'（名前なし）'; cs.append(o); });
    const c=chara(); if(!c){ document.title='おしゃべり'; return; }
    current=c.id; cs.value=c.id; document.title=c.name;
    c.voices.forEach(v=>{ const o=document.createElement('option'); o.value=v.id; o.textContent='声: '+(v.name||'（名前なし）'); vs.append(o); });
    vs.value = (voice()||{}).id || '';
    vs.style.display = c.voices.length>1 ? '' : 'none';
    input.placeholder = c.name + 'に話しかける';
  }
  $('charaSel').onchange = e => { current=e.target.value; LS.set('currentChara',current); log.innerHTML=''; renderHeader(); setStatus(''); };
  $('voiceSel').onchange = e => { const c=chara(); c.voiceId=e.target.value; saveCharas(); setStatus('声を「'+voice().name+'」にした'); };

  // ---- 設定画面 ----
  function renderSettings(){
    G.forEach(k=>{ const v=LS.get(k); if(v) $(k).value=v; });
    if(!LS.get('autoplay')) $('autoplay').value='1';
    if(!LS.get('autosend')) $('autosend').value='1';
    const list=$('charaList'); list.innerHTML='';
    charas.forEach(c=>{
      const card=document.createElement('div'); card.className='card'; card.dataset.id=c.id;
      card.innerHTML=`
        <div class="head"><input class="cname" placeholder="キャラの名前" value=""><button type="button" class="x del" aria-label="このキャラを消す">×</button></div>
        <label>Dify APIキー（このキャラのアプリの app-…）</label><input class="dkey" type="password" autocomplete="off">
        <label>Dify APIエンドポイント</label><input class="durl" type="url">
        <label>声（名前 ／ Fish AudioのモデルID）</label>
        <div class="voices"></div>
        <button type="button" class="add addv">＋ 声を追加</button>
        <div class="quiet"><button type="button" class="link reset">この子との会話をリセット（記憶を最初から）</button></div>`;
      card.querySelector('.cname').value=c.name||'';
      card.querySelector('.dkey').value=c.difyKey||'';
      card.querySelector('.durl').value=c.difyUrl||'https://api.dify.ai/v1';
      const vbox=card.querySelector('.voices');
      const addVoiceRow=(v)=>{
        const r=document.createElement('div'); r.className='voice-row'; r.dataset.vid=v.id;
        r.innerHTML=`<input class="name" placeholder="いつもの"><input class="ref" placeholder="モデルID" autocomplete="off"><button type="button" class="x" aria-label="この声を消す">×</button>`;
        r.querySelector('.name').value=v.name||''; r.querySelector('.ref').value=v.ref||'';
        r.querySelector('.x').onclick=()=>r.remove();
        vbox.append(r);
      };
      (c.voices.length?c.voices:[{id:uid(),name:'いつもの',ref:''}]).forEach(addVoiceRow);
      card.querySelector('.addv').onclick=()=>addVoiceRow({id:uid(),name:'',ref:''});
      card.querySelector('.del').onclick=()=>{ if(confirm(`「${c.name}」を消す？`)) card.remove(); };
      card.querySelector('.reset').onclick=()=>{ c.conversationId=''; saveCharas(); if(c.id===current) log.innerHTML=''; setStatus(c.name+'との会話をリセットした'); };
      list.append(card);
    });
  }
  function collectSettings(){
    G.forEach(k=>LS.set(k,$(k).value.trim()));
    const next=[];
    document.querySelectorAll('#charaList .card').forEach(card=>{
      const id=card.dataset.id, old=charas.find(c=>c.id===id)||{};
      const voices=[...card.querySelectorAll('.voice-row')].map(r=>({id:r.dataset.vid, name:r.querySelector('.name').value.trim()||'いつもの', ref:r.querySelector('.ref').value.trim()})).filter(v=>v.ref);
      next.push({ id, name:card.querySelector('.cname').value.trim()||'（名前なし）',
        difyKey:card.querySelector('.dkey').value.trim(), difyUrl:card.querySelector('.durl').value.trim()||'https://api.dify.ai/v1',
        voices, voiceId: voices.some(v=>v.id===old.voiceId)?old.voiceId:(voices[0]||{}).id, conversationId:old.conversationId||'' });
    });
    charas=next; saveCharas();
    if(!charas.some(c=>c.id===current)) { current=(charas[0]||{}).id; LS.set('currentChara',current||''); }
  }
  $('openSettings').onclick=()=>{ renderSettings(); $('settings').classList.add('open'); };
  $('cancelSettings').onclick=()=>$('settings').classList.remove('open');
  $('saveSettings').onclick=()=>{ collectSettings(); $('settings').classList.remove('open'); renderHeader(); setStatus('保存した'); };
  $('addChara').onclick=()=>{ collectSettings(); charas.push({id:uid(),name:'',difyKey:'',difyUrl:'https://api.dify.ai/v1',voices:[],voiceId:null,conversationId:''}); renderSettings(); window.scrollTo(0,document.body.scrollHeight); };
  const ready=()=>{ const c=chara(); return c&&c.difyKey&&LS.get('fishKey')&&voice()&&voice().ref; };

  // ---- 表示 ----
  function addMsg(who,text){
    const row=document.createElement('div'); row.className='msg '+who;
    const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
    let btn=null;
    if(who==='chara'){ btn=document.createElement('button'); btn.className='replay'; btn.textContent='▶︎'; btn.disabled=true; btn.type='button'; row.append(btn,b); }
    else row.append(b);
    log.append(row); log.scrollTop=log.scrollHeight;
    return {row,b,btn};
  }

  // ---- Dify ----
  async function askDify(query){
    const c=chara();
    const r=await fetch(c.difyUrl.replace(/\/$/,'')+'/chat-messages',{
      method:'POST',headers:{'Authorization':'Bearer '+c.difyKey,'Content-Type':'application/json'},
      body:JSON.stringify({inputs:{},query,response_mode:'blocking',user:userId,...(c.conversationId?{conversation_id:c.conversationId}:{})})
    }).catch(e=>{ throw new Error('Difyにつながらなかった（'+e.message+'）'); });
    if(!r.ok){
      const t=await r.text();
      let m=t; try{ const j=JSON.parse(t); m=j.message||t; }catch{}
      if(/RESOURCE_EXHAUSTED|429/.test(m)) m='モデルの利用枠を使い切ってる（Difyのモデル設定を確認）';
      throw new Error('Dify '+r.status+'：'+m.slice(0,160));
    }
    const j=await r.json();
    if(j.conversation_id){ c.conversationId=j.conversation_id; saveCharas(); }
    return j.answer||'';
  }

  // ---- Fish Audio ----
  async function speak(text){
    const v=voice(); const proxy=LS.get('fishProxy').trim();
    const url = proxy ? proxy.replace(/\/$/,'')+'/v1/tts' : 'https://api.fish.audio/v1/tts';
    const r=await fetch(url,{
      method:'POST',
      headers:{'Authorization':'Bearer '+LS.get('fishKey'),'Content-Type':'application/json','model':LS.get('fishModel')||'s2.1-pro'},
      body:JSON.stringify({text,reference_id:v.ref,format:'mp3',latency:'normal'})
    }).catch(e=>{ throw new Error('Fish Audioにつながらなかった（'+e.message+'）。設定の「経由地URL」が要るかも'); });
    if(!r.ok) throw new Error('Fish Audio '+r.status+'：'+(await r.text()).slice(0,160));
    return URL.createObjectURL(await r.blob());
  }
  const play = url => { player.src=url; return player.play(); };

  // ---- 送信 ----
  async function submit(){
    const text=input.value.trim(); if(!text) return;
    if(!ready()){ renderSettings(); $('settings').classList.add('open'); setStatus('先にキーと声を入れて',true); return; }
    unlock();
    input.value=''; send.disabled=true;
    addMsg('me',text);
    const wait=addMsg('chara','……'); wait.row.classList.add('thinking');
    try{
      setStatus(chara().name+'が考えてる');
      const answer=await askDify(text);
      wait.row.classList.remove('thinking'); wait.b.textContent=answer; log.scrollTop=log.scrollHeight;
      try{
        setStatus('声を作ってる');
        const url=await speak(answer);
        wait.btn.disabled=false; wait.btn.onclick=()=>play(url).catch(e=>setStatus('再生できない：'+e.message,true));
        setStatus('');
        if(LS.get('autoplay')!=='0'){ try{ await play(url); }catch{ setStatus('自動再生が止められた。▶︎を押すと鳴る',true); } }
      }catch(e){ setStatus(e.message,true); }
    }catch(e){
      wait.row.classList.remove('thinking'); wait.b.textContent='（返事が届かなかった）'; setStatus(e.message,true);
    }finally{ send.disabled=false; }
  }
  $('chat').addEventListener('submit',e=>{e.preventDefault();submit();});
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();} });

  // ---- マイク（Safari内蔵の音声認識） ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec=null, listening=false;
  if(!SR){ mic.classList.add('off'); }
  else{
    rec=new SR(); rec.lang='ja-JP'; rec.interimResults=true; rec.continuous=false;
    rec.onresult=e=>{
      let t=''; for(const r of e.results) t+=r[0].transcript;
      input.value=t;
      if(e.results[e.results.length-1].isFinal){ stopMic(); if(LS.get('autosend')!=='0') submit(); }
    };
    rec.onerror=e=>{ stopMic(); if(e.error!=='no-speech'&&e.error!=='aborted') setStatus('マイクが使えない：'+e.error+'（設定→Safari→マイクを許可）',true); };
    rec.onend=()=>stopMic();
  }
  function startMic(){ if(!rec||listening) return; unlock(); try{ rec.start(); listening=true; mic.classList.add('on'); setStatus('聞いてる…'); }catch{} }
  function stopMic(){ if(!listening) return; listening=false; mic.classList.remove('on'); try{rec.stop();}catch{} if(status.textContent==='聞いてる…') setStatus(''); }
  mic.onclick=()=>listening?stopMic():startMic();

  // ---- 起動 ----
  renderHeader();
  if(!ready()){ renderSettings(); $('settings').classList.add('open'); }
})();
</script>
</body>
</html>
