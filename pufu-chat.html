<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puppet Chat">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Puppet Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1a1428;--night-2:#241c36;--ink:#f2ecf7;--dim:#a99bbf;
    --wing:#f3a9a0;--wing-deep:#c9746e;--mint:#bfe9d9;--mint-ink:#173a30;
    --line:rgba(243,169,160,.22);--rec:#ff7a6e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--night);color:var(--ink)}
  body{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:16px;line-height:1.7;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  header select{background:none;color:var(--ink);border:none;font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-weight:600;font-size:20px;letter-spacing:.06em;padding:4px 0;max-width:46%}
  header select.voice{font-family:inherit;font-weight:400;font-size:14px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  header .sp{flex:1}
  header button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px}
  #status{font-size:12px;color:var(--dim);padding:6px 16px 0;min-height:1.4em;word-break:break-all}
  #status.err{color:#ffb4a8}
  #log{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
  .msg{display:flex;margin:10px 0;gap:8px;align-items:flex-end}
  .msg.me{justify-content:flex-end}
  .bubble{max-width:78%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:none;user-select:none}
  .me .bubble{background:var(--mint);color:var(--mint-ink);border-bottom-right-radius:5px}
  .chara .bubble{background:var(--night-2);border:1px solid var(--line);border-bottom-left-radius:5px;
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:1.85}
  .chara .bubble.edited{border-color:var(--wing)}
  .replay{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--wing);font-size:15px}
  .replay:disabled{opacity:.35}
  .thinking .bubble{color:var(--dim);font-style:italic}
  form{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line);background:var(--night);align-items:flex-end}
  textarea{flex:1;resize:none;height:46px;max-height:120px;background:var(--night-2);color:var(--ink);
    border:1px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px}
  textarea:focus{outline:2px solid var(--wing);outline-offset:0}
  #mic,#send{width:50px;height:46px;border-radius:14px;border:none;font-size:20px;font-weight:600}
  #send{background:var(--wing);color:var(--night)}
  #send:disabled{background:var(--wing-deep);opacity:.6}
  #mic{background:var(--night-2);color:var(--wing);border:1px solid var(--line)}
  #mic.on{background:var(--rec);color:#fff;border-color:var(--rec)}
  #mic.off{display:none}

  .sheet{position:fixed;inset:0;background:rgba(26,20,40,.97);overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 20px) 20px 60px;display:none;z-index:5}
  .sheet.open{display:block}
  .sheet h2{font-family:"Shippori Mincho",serif;font-weight:600;font-size:22px;margin:0 0 6px}
  .sheet h3{font-family:"Shippori Mincho",serif;font-weight:600;font-size:18px;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line)}
  .sheet p{color:var(--dim);font-size:14px;margin:0 0 14px}
  label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px}
  input,select.full,textarea.full{width:100%;background:var(--night-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:16px}
  textarea.full{height:auto;min-height:140px;font-family:"Shippori Mincho",serif;font-size:17px;line-height:1.8}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;margin-top:14px}
  .card .head{display:flex;align-items:center;gap:10px}
  .card .head input{flex:1;font-family:"Shippori Mincho",serif;font-size:18px}
  .pair{display:flex;gap:8px;margin-top:8px;align-items:center}
  .pair input{flex:1}
  .pair input.name{flex:0 0 38%}
  .x{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;width:40px;height:44px;font-size:18px;flex:none}
  .add{background:none;border:1px dashed var(--line);color:var(--wing);border-radius:10px;padding:10px;font:inherit;font-size:14px;width:100%;margin-top:10px}
  .row{display:flex;gap:12px;margin-top:28px}
  .row button{flex:1;padding:13px;border-radius:12px;font:inherit;font-size:16px;border:1px solid var(--line);background:none;color:var(--ink)}
  .row button.primary{background:var(--wing);color:var(--night);border-color:var(--wing);font-weight:600}
  .quiet{margin-top:8px;font-size:13px;color:var(--dim)}
  .link{background:none;border:none;color:var(--dim);text-decoration:underline;font:inherit;font-size:13px;padding:0}
  .menu{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);
    background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:6px;display:none;z-index:6;min-width:260px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .menu.open{display:block}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;border-radius:10px}
  .menu button:active{background:rgba(255,255,255,.06)}
  .menu button.dim{color:var(--dim);font-size:14px}
  @media (prefers-reduced-motion:no-preference){
    .bubble{animation:pop .18s ease-out}
    @keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
    #mic.on{animation:pulse 1s infinite alternate}
    @keyframes pulse{to{box-shadow:0 0 0 6px rgba(255,122,110,.25)}}
  }
</style>
</head>
<body>

<header>
  <select id="charaSel" aria-label="キャラ"></select>
  <select id="voiceSel" class="voice" aria-label="声"></select>
  <span class="sp"></span>
  <button id="openSettings" type="button">設定</button>
</header>
<div id="status"></div>
<div id="log"></div>

<form id="chat">
  <textarea id="input" placeholder="話しかける" rows="1" enterkeyhint="send"></textarea>
  <button id="mic" type="button" aria-label="声で話す">🎙</button>
  <button id="send" type="submit">♪</button>
</form>

<!-- 長押しメニュー -->
<div class="menu" id="menu">
  <button data-act="edit">✎ 文を直して声を作り直す</button>
  <button data-act="dict">📖 読み替え辞書に登録</button>
  <button data-act="save">⤓ 音声を保存（mp3）</button>
  <button data-act="close" class="dim">閉じる</button>
</div>

<!-- 編集 -->
<div class="sheet" id="editor">
  <h2>文を直す</h2>
  <p>直した文で声を作り直す。画面の文字も直した方に変わる（キャラ側の記憶は元のまま）。</p>
  <textarea class="full" id="editText"></textarea>
  <div class="row">
    <button type="button" id="editCancel">やめる</button>
    <button type="button" class="primary" id="editGo">声を作り直す</button>
  </div>
</div>

<!-- 辞書登録 -->
<div class="sheet" id="dictSheet">
  <h2>読み替え辞書に登録</h2>
  <p>声を作る時だけ「元の言葉」を「読ませ方」に置き換える。画面の文字は変わらない。</p>
  <label for="dictFrom">元の言葉（吹き出しの中の言葉）</label>
  <input id="dictFrom" autocomplete="off" placeholder="例：猶予">
  <label for="dictTo">読ませ方（ひらがな）</label>
  <input id="dictTo" autocomplete="off" placeholder="例：ゆうよ">
  <div class="row">
    <button type="button" id="dictCancel">やめる</button>
    <button type="button" class="primary" id="dictGo">登録して声を作り直す</button>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="settings">
  <h2>設定</h2>
  <p>キーはこのiPadの中にだけ保存される。どこにも送らない。</p>

  <label for="fishKey">Fish Audio APIキー</label>
  <input id="fishKey" type="password" autocomplete="off">
  <label for="fishModel">Fish Audio 音声エンジン</label>
  <select id="fishModel" class="full">
    <option value="s2.1-pro">S2.1 Pro（今の最上位）</option>
    <option value="s2.1-pro-free">S2.1 Pro 無料枠</option>
    <option value="s2">S2</option>
    <option value="s1">S1（旧）</option>
  </select>
  <label for="fishProxy">Fish Audio 経由地URL</label>
  <input id="fishProxy" type="url" placeholder="https://fish-proxy.〇〇.workers.dev">
  <label for="autoplay">返事が来たら自動で声を鳴らす</label>
  <select id="autoplay" class="full"><option value="1">鳴らす</option><option value="0">鳴らさない（▶︎の時だけ）</option></select>
  <label for="autosend">マイクで喋り終わったら自動で送る</label>
  <select id="autosend" class="full"><option value="1">送る</option><option value="0">送らない（確認してから♪）</option></select>

  <h3>キャラ</h3>
  <p>1人につきDifyのアプリ1個。声は何個でも登録できて、上の画面で切り替えられる。</p>
  <div id="charaList"></div>
  <button type="button" class="add" id="addChara">＋ キャラを追加</button>

  <div class="row">
    <button type="button" id="cancelSettings">閉じる</button>
    <button type="button" class="primary" id="saveSettings">保存する</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const log=$('log'), status=$('status'), input=$('input'), send=$('send'), mic=$('mic');
  const G = ['fishKey','fishModel','fishProxy','autoplay','autosend'];
  const LS = { get:k=>localStorage.getItem('chat.'+k)??'', set:(k,v)=>localStorage.setItem('chat.'+k,v) };
  const uid = () => Math.random().toString(36).slice(2,10);
  const userId = LS.get('userId') || (()=>{const u='mint-'+uid(); LS.set('userId',u); return u;})();

  // ---- データ ----
  // chara: {id,name,difyKey,difyUrl,voices:[{id,name,ref}],voiceId,conversationId,dict:[{from,to}]}
  let charas=[]; try{ charas=JSON.parse(LS.get('charas')||'[]'); }catch{ charas=[]; }
  if(!charas.length && localStorage.getItem('pufu.difyKey')){
    const o=k=>localStorage.getItem('pufu.'+k)||'';
    charas=[{id:uid(),name:'プフ',difyKey:o('difyKey'),difyUrl:o('difyUrl')||'https://api.dify.ai/v1',
      voices:[{id:uid(),name:'いつもの',ref:o('fishRef')}],voiceId:null,conversationId:o('conversationId'),dict:[]}];
    charas[0].voiceId=charas[0].voices[0].id; LS.set('charas',JSON.stringify(charas));
    if(!LS.get('fishKey')) LS.set('fishKey',o('fishKey'));
  }
  charas.forEach(c=>{ if(!Array.isArray(c.dict)) c.dict=[]; });
  let current=LS.get('currentChara');
  const chara=()=>charas.find(c=>c.id===current)||charas[0];
  const voice=()=>{ const c=chara(); return c&&(c.voices.find(v=>v.id===c.voiceId)||c.voices[0]); };
  const saveCharas=()=>LS.set('charas',JSON.stringify(charas));

  // ---- iPad：タップの中で一度無音を鳴らして自動再生を解錠 ----
  const player=new Audio(); player.setAttribute('playsinline','');
  let unlocked=false;
  function silentWav(){
    const sr=8000,n=160,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  }
  const silence=silentWav();
  function unlock(){ if(unlocked) return; player.src=silence; player.play().then(()=>{unlocked=true}).catch(()=>{}); }
  function setStatus(t,err=false){ status.textContent=t||''; status.className=err?'err':''; }

  // ---- 再生キュー（文ごとの音声を順番に鳴らす） ----
  let playToken=0;
  function playOne(url){
    return new Promise((res,rej)=>{
      player.onended=()=>res(); player.onerror=()=>rej(new Error('再生できない'));
      player.src=url; player.play().catch(rej);
    });
  }
  async function playSeq(chunkPromises){
    const my=++playToken;
    for(const p of chunkPromises){
      const chunk=await p; if(my!==playToken) return;
      if(chunk&&chunk.url) await playOne(chunk.url);
      if(my!==playToken) return;
    }
  }

  // ---- ヘッダー ----
  function renderHeader(){
    const cs=$('charaSel'), vs=$('voiceSel'); cs.innerHTML=''; vs.innerHTML='';
    charas.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name||'（名前なし）'; cs.append(o); });
    const c=chara(); if(!c) return;
    current=c.id; cs.value=c.id;
    c.voices.forEach(v=>{ const o=document.createElement('option'); o.value=v.id; o.textContent='声: '+(v.name||'（名前なし）'); vs.append(o); });
    vs.value=(voice()||{}).id||''; vs.style.display=c.voices.length>1?'':'none';
    input.placeholder=c.name+'に話しかける';
  }
  $('charaSel').onchange=e=>{ current=e.target.value; LS.set('currentChara',current); log.innerHTML=''; playToken++; renderHeader(); setStatus(''); };
  $('voiceSel').onchange=e=>{ const c=chara(); c.voiceId=e.target.value; saveCharas(); setStatus('声を「'+voice().name+'」にした'); };

  // ---- 設定画面 ----
  function renderSettings(){
    G.forEach(k=>{ const v=LS.get(k); if(v) $(k).value=v; });
    if(!LS.get('autoplay')) $('autoplay').value='1';
    if(!LS.get('autosend')) $('autosend').value='1';
    const list=$('charaList'); list.innerHTML='';
    charas.forEach(c=>{
      const card=document.createElement('div'); card.className='card'; card.dataset.id=c.id;
      card.innerHTML=`
        <div class="head"><input class="cname" placeholder="キャラの名前"><button type="button" class="x del" aria-label="このキャラを消す">×</button></div>
        <label>Dify APIキー（このキャラのアプリの app-…）</label><input class="dkey" type="password" autocomplete="off">
        <label>Dify APIエンドポイント</label><input class="durl" type="url">
        <label>声（名前 ／ Fish AudioのモデルID）</label>
        <div class="voices"></div><button type="button" class="add addv">＋ 声を追加</button>
        <label>読み替え辞書（元の言葉 ／ 読ませ方）</label>
        <div class="dict"></div><button type="button" class="add addd">＋ 言葉を追加</button>
        <div class="quiet"><button type="button" class="link reset">この子との会話をリセット（記憶を最初から）</button></div>`;
      card.querySelector('.cname').value=c.name||'';
      card.querySelector('.dkey').value=c.difyKey||'';
      card.querySelector('.durl').value=c.difyUrl||'https://api.dify.ai/v1';
      const pairRow=(box,cls,a,b,pa,pb)=>{
        const r=document.createElement('div'); r.className='pair'; if(cls) r.dataset.vid=cls;
        r.innerHTML=`<input class="name" placeholder="${pa}"><input class="val" placeholder="${pb}" autocomplete="off"><button type="button" class="x">×</button>`;
        r.querySelector('.name').value=a||''; r.querySelector('.val').value=b||'';
        r.querySelector('.x').onclick=()=>r.remove(); box.append(r);
      };
      const vbox=card.querySelector('.voices'), dbox=card.querySelector('.dict');
      (c.voices.length?c.voices:[{id:uid(),name:'いつもの',ref:''}]).forEach(v=>pairRow(vbox,v.id,v.name,v.ref,'いつもの','モデルID'));
      c.dict.forEach(d=>pairRow(dbox,null,d.from,d.to,'元の言葉','読ませ方'));
      card.querySelector('.addv').onclick=()=>pairRow(vbox,uid(),'','','名前','モデルID');
      card.querySelector('.addd').onclick=()=>pairRow(dbox,null,'','','元の言葉','読ませ方');
      card.querySelector('.del').onclick=()=>{ if(confirm(`「${c.name}」を消す？`)) card.remove(); };
      card.querySelector('.reset').onclick=()=>{ c.conversationId=''; saveCharas(); if(c.id===current) log.innerHTML=''; setStatus(c.name+'との会話をリセットした'); };
      list.append(card);
    });
  }
  function collectSettings(){
    G.forEach(k=>LS.set(k,$(k).value.trim()));
    const next=[];
    document.querySelectorAll('#charaList .card').forEach(card=>{
      const id=card.dataset.id, old=charas.find(c=>c.id===id)||{};
      const voices=[...card.querySelectorAll('.voices .pair')].map(r=>({id:r.dataset.vid,name:r.querySelector('.name').value.trim()||'いつもの',ref:r.querySelector('.val').value.trim()})).filter(v=>v.ref);
      const dict=[...card.querySelectorAll('.dict .pair')].map(r=>({from:r.querySelector('.name').value.trim(),to:r.querySelector('.val').value.trim()})).filter(d=>d.from&&d.to);
      next.push({id,name:card.querySelector('.cname').value.trim()||'（名前なし）',
        difyKey:card.querySelector('.dkey').value.trim(),difyUrl:card.querySelector('.durl').value.trim()||'https://api.dify.ai/v1',
        voices,voiceId:voices.some(v=>v.id===old.voiceId)?old.voiceId:(voices[0]||{}).id,conversationId:old.conversationId||'',dict});
    });
    charas=next; saveCharas();
    if(!charas.some(c=>c.id===current)){ current=(charas[0]||{}).id; LS.set('currentChara',current||''); }
  }
  $('openSettings').onclick=()=>{ renderSettings(); $('settings').classList.add('open'); };
  $('cancelSettings').onclick=()=>$('settings').classList.remove('open');
  $('saveSettings').onclick=()=>{ collectSettings(); $('settings').classList.remove('open'); renderHeader(); setStatus('保存した'); };
  $('addChara').onclick=()=>{ collectSettings(); charas.push({id:uid(),name:'',difyKey:'',difyUrl:'https://api.dify.ai/v1',voices:[],voiceId:null,conversationId:'',dict:[]}); renderSettings(); window.scrollTo(0,document.body.scrollHeight); };
  const ready=()=>{ const c=chara(); return c&&c.difyKey&&LS.get('fishKey')&&voice()&&voice().ref; };

  // ---- 表示 ----
  const msgs=new Map(); // row -> {text, chunks:[{text,url,blob}], busy}
  function addMsg(who,text){
    const row=document.createElement('div'); row.className='msg '+who;
    const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
    let btn=null;
    if(who==='chara'){
      btn=document.createElement('button'); btn.className='replay'; btn.textContent='▶︎'; btn.disabled=true; btn.type='button';
      row.append(btn,b); attachLongPress(b,row);
    } else row.append(b);
    log.append(row); log.scrollTop=log.scrollHeight;
    return {row,b,btn};
  }

  // ---- Dify ----
  async function askDify(query){
    const c=chara();
    const r=await fetch(c.difyUrl.replace(/\/$/,'')+'/chat-messages',{
      method:'POST',headers:{'Authorization':'Bearer '+c.difyKey,'Content-Type':'application/json'},
      body:JSON.stringify({inputs:{},query,response_mode:'blocking',user:userId,...(c.conversationId?{conversation_id:c.conversationId}:{})})
    }).catch(e=>{ throw new Error('Difyにつながらなかった（'+e.message+'）'); });
    if(!r.ok){
      const t=await r.text(); let m=t; try{ m=JSON.parse(t).message||t; }catch{}
      if(/RESOURCE_EXHAUSTED|429/.test(m)) m='モデルの利用枠を使い切ってる（Difyのモデル設定を確認）';
      throw new Error('Dify '+r.status+'：'+m.slice(0,160));
    }
    const j=await r.json();
    if(j.conversation_id){ c.conversationId=j.conversation_id; saveCharas(); }
    return j.answer||'';
  }

  // ---- Fish Audio ----
  function applyDict(text){
    const d=[...(chara().dict||[])].sort((a,b)=>b.from.length-a.from.length);
    for(const {from,to} of d) text=text.split(from).join(to);
    return text;
  }
  function splitSentences(text){
    const parts=(text.match(/[^。！？!?\n]+[。！？!?]*/g)||[]).map(s=>s.trim()).filter(Boolean);
    const out=[];
    for(const p of parts){ if(out.length&&(p.length<8||out[out.length-1].length<8)) out[out.length-1]+=p; else out.push(p); }
    return out.length?out:[text];
  }
  async function ttsOne(text){
    const v=voice(); const proxy=LS.get('fishProxy').trim();
    const url=proxy?proxy.replace(/\/$/,'')+'/v1/tts':'https://api.fish.audio/v1/tts';
    const r=await fetch(url,{method:'POST',
      headers:{'Authorization':'Bearer '+LS.get('fishKey'),'Content-Type':'application/json','model':LS.get('fishModel')||'s2.1-pro'},
      body:JSON.stringify({text:applyDict(text),reference_id:v.ref,format:'mp3',latency:'balanced'})
    }).catch(e=>{ throw new Error('Fish Audioにつながらなかった（'+e.message+'）。設定の「経由地URL」を確認'); });
    if(!r.ok) throw new Error('Fish Audio '+r.status+'：'+(await r.text()).slice(0,160));
    const blob=await r.blob(); return {text,blob,url:URL.createObjectURL(blob)};
  }
  // 文ごとに並行して作り、できた順に鳴らす
  function synthesize(row,text,autoplay){
    const m=msgs.get(row)||{}; m.text=text; m.chunks=[]; m.busy=true; msgs.set(row,m);
    const btn=row.querySelector('.replay'); btn.disabled=true;
    const sentences=splitSentences(text);
    const promises=sentences.map(s=>ttsOne(s));
    const all=Promise.all(promises).then(chunks=>{ m.chunks=chunks; m.busy=false; btn.disabled=false; setStatus(''); return chunks; })
      .catch(e=>{ m.busy=false; setStatus(e.message,true); throw e; });
    btn.onclick=()=>{ unlock(); playSeq(m.chunks.map(c=>Promise.resolve(c))).catch(e=>setStatus('再生できない：'+e.message,true)); };
    if(autoplay){ playSeq(promises).catch(e=>{ if(!/Fish/.test(e.message)) setStatus('自動再生が止められた。▶︎を押すと鳴る',true); }); }
    return all;
  }

  // ---- 送信 ----
  async function submit(){
    const text=input.value.trim(); if(!text) return;
    if(!ready()){ renderSettings(); $('settings').classList.add('open'); setStatus('先にキーと声を入れて',true); return; }
    unlock(); playToken++;
    input.value=''; send.disabled=true;
    addMsg('me',text);
    const wait=addMsg('chara','……'); wait.row.classList.add('thinking');
    try{
      setStatus(chara().name+'が考えてる');
      const answer=await askDify(text);
      wait.row.classList.remove('thinking'); wait.b.textContent=answer; log.scrollTop=log.scrollHeight;
      setStatus('声を作ってる');
      synthesize(wait.row,answer,LS.get('autoplay')!=='0').catch(()=>{});
    }catch(e){
      wait.row.classList.remove('thinking'); wait.b.textContent='（返事が届かなかった）'; setStatus(e.message,true);
    }finally{ send.disabled=false; }
  }
  $('chat').addEventListener('submit',e=>{e.preventDefault();submit();});
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();} });

  // ---- 長押しメニュー ----
  let target=null, pressTimer=null;
  function attachLongPress(el,row){
    const start=()=>{ pressTimer=setTimeout(()=>{ target=row; $('menu').classList.add('open'); if(navigator.vibrate) navigator.vibrate(10); },500); };
    const cancel=()=>clearTimeout(pressTimer);
    el.addEventListener('touchstart',start,{passive:true}); el.addEventListener('touchend',cancel); el.addEventListener('touchmove',cancel); el.addEventListener('touchcancel',cancel);
    el.addEventListener('mousedown',start); el.addEventListener('mouseup',cancel); el.addEventListener('mouseleave',cancel);
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
  $('menu').addEventListener('click',e=>{
    const act=e.target.dataset.act; if(!act) return;
    $('menu').classList.remove('open');
    const m=target&&msgs.get(target); if(!m||act==='close') return;
    if(m.busy){ setStatus('声を作ってる途中。少し待って',true); return; }
    if(act==='edit'){ $('editText').value=m.text; $('editor').classList.add('open'); }
    if(act==='dict'){ $('dictFrom').value=''; $('dictTo').value=''; $('dictSheet').classList.add('open'); }
    if(act==='save') saveAudio(m);
  });
  $('editCancel').onclick=()=>$('editor').classList.remove('open');
  $('editGo').onclick=()=>{
    const t=$('editText').value.trim(); $('editor').classList.remove('open'); if(!t||!target) return;
    unlock(); playToken++;
    const b=target.querySelector('.bubble'); b.textContent=t; b.classList.add('edited');
    setStatus('声を作り直してる'); synthesize(target,t,true).catch(()=>{});
  };
  $('dictCancel').onclick=()=>$('dictSheet').classList.remove('open');
  $('dictGo').onclick=()=>{
    const from=$('dictFrom').value.trim(), to=$('dictTo').value.trim(); $('dictSheet').classList.remove('open');
    if(!from||!to) return;
    const c=chara(); c.dict=c.dict.filter(d=>d.from!==from); c.dict.push({from,to}); saveCharas();
    const m=msgs.get(target); if(!m) return;
    unlock(); playToken++; setStatus('「'+from+'」を「'+to+'」と読む。声を作り直してる');
    synthesize(target,m.text,true).catch(()=>{});
  };
  function saveAudio(m){
    if(!m.chunks.length){ setStatus('まだ音声がない',true); return; }
    const blob=new Blob(m.chunks.map(c=>c.blob),{type:'audio/mpeg'});
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    const name=`${chara().name}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.mp3`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove();
    setStatus('保存した：'+name);
  }

  // ---- マイク ----
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null, listening=false;
  if(!SR){ mic.classList.add('off'); }
  else{
    rec=new SR(); rec.lang='ja-JP'; rec.interimResults=true; rec.continuous=false;
    rec.onresult=e=>{ let t=''; for(const r of e.results) t+=r[0].transcript; input.value=t;
      if(e.results[e.results.length-1].isFinal){ stopMic(); if(LS.get('autosend')!=='0') submit(); } };
    rec.onerror=e=>{ stopMic(); if(e.error!=='no-speech'&&e.error!=='aborted') setStatus('マイクが使えない：'+e.error+'（設定→Safari→マイクを許可）',true); };
    rec.onend=()=>stopMic();
  }
  function startMic(){ if(!rec||listening) return; unlock(); playToken++; try{ rec.start(); listening=true; mic.classList.add('on'); setStatus('聞いてる…'); }catch{} }
  function stopMic(){ if(!listening) return; listening=false; mic.classList.remove('on'); try{rec.stop();}catch{} if(status.textContent==='聞いてる…') setStatus(''); }
  mic.onclick=()=>listening?stopMic():startMic();

  renderHeader();
  if(!ready()){ renderSettings(); $('settings').classList.add('open'); }
})();
</script>
</body>
</html>
